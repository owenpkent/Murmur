<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Murmur">
  <title>Murmur</title>
  <!--
    The Murmur mark: five rounded bars rising and falling, the middle one lit. It is a
    voice level meter, which is what the plugin listens to.

    Master for installer/generate_brand.py, which mirrors this geometry in `draw_mark`.
    Redraw here, mirror there, regenerate.

      ground #0e0f12
      bar    #ffffff -> #cdd3db
      lit    #35c4d7 -> #1b8496
    Bars are 28 wide with a 14 gap, starting at x = 30, centred on y = 128, heights
    64 / 112 / 172 / 112 / 64, corner radius 14.
  -->
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdd3db"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35c4d7"/><stop offset="1" stop-color="#1b8496"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0e0f12"/>
  <rect x="30"  y="96"  width="28" height="64"  rx="14" fill="url(#ivory)"/>
  <rect x="72"  y="72"  width="28" height="112" rx="14" fill="url(#ivory)"/>
  <rect x="114" y="42"  width="28" height="172" rx="14" fill="url(#lit)"/>
  <rect x="156" y="72"  width="28" height="112" rx="14" fill="url(#ivory)"/>
  <rect x="198" y="96"  width="28" height="64"  rx="14" fill="url(#ivory)"/>
</svg>
